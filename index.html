<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi muro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mi muro</h1>
    <div class="acciones">
      <button id="btnAsc" class="sec">A → Z</button>
      <button id="btnDesc" class="sec">Z → A</button>
    </div>
  </header>

  <form id="formNota">
    <input type="text" id="titulo" placeholder="Título" maxlength="100" required>
    <textarea id="contenido" rows="3" placeholder="Información..."></textarea>
    <button type="submit">Publicar</button>
  </form>

  <p id="mensaje"></p>

  <main id="muro"></main>

  <!-- Librería de Supabase (versión fija, con verificación de integridad) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"
    integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ"
    crossorigin="anonymous"></script>
  <!-- Conexión con la base de datos (debe ir antes que app.js) -->
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
